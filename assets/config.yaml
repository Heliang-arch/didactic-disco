# ============================================================
# 线性代数2.1 验证数据集
# 用途：验证两阶段矩阵运算实现是否与预期输出一致
# ============================================================

meta:
  description: >
    验证"第一阶段(α·C·w/100) → 第二阶段(β₀+β·z_selected)"的矩阵运算实现。
    单煤指标来自基准配比数据，模型参数来自设计说明书。
  verification_target: "线性代数2.1 两阶段焦炭质量预测模型"
  known_uncertainties:
    - "FC_d 从 extended.__EMPTY_16 推断，非直接确认字段"
    - "coal_007 (PSM1) 的 FC_d 缺失，已从测试方案中排除"
    - "若 C 矩阵构建规则(指标→c_{j,i}的映射)与实际不同，需重新计算预期输出"

# ============================================================
# 模型参数（来自设计说明书，已确认 [1]）
# ============================================================
model_params:
  alpha: [1.3, 0.9, 1.0, 1.0, 1.0, 1.0]
    # α₁=1.3 (z₁, Ad预测), α₂=0.9 (z₂, St.d预测),
    # α₃~α₆=1.0 (z₃~z₆: M40/M10/CRI/CSR预测) [1]

  beta_0: [0.1651, 82.00, 6.151, 9.79, 64.93]
    # 回归截距: St.d/M40/M10/CRI/CSR [1]

  beta: [0.7610, 0.0613, -0.0154, 0.4717, 0.0245]
    # 回归系数: 分别作用于 z₂, z₃, z₄, z₅, z₆ [1]

  formula_stage1: "z_j = (α_j / 100) × Σ_i(C_{j,i} × w_i), j=1..6"
  formula_stage2: "y_k = β₀_k + β_k × z_{k+1}, k=1..5"

# ============================================================
# 单煤指标（用于构建系数矩阵 C_{6×m}）
# ============================================================
single_coals:
  coal_001:
    name: "JM2_龙马"
    indicators:
      Ad: 11.03        # → C[0,i] = c₁ (z₁ 贡献)
      Vdaf: 20.78      # → C[1,i] = c₂ (z₂ 贡献)
      St_d: 2.53       # → C[2,i] = c₃ (z₃ 贡献)
      G: 78            # → C[3,i] = c₄ (z₄ 贡献)
      Y: 15            # → C[4,i] = c₅ (z₅ 贡献)
      FC_d: 56.06      # → C[5,i] = c₆ (z₆ 贡献) [推断自 __EMPTY_16]

  coal_004:
    name: "FM1_柏果"
    indicators:
      Ad: 10.21
      Vdaf: 31.32
      St_d: 0.21
      G: 89
      Y: 25
      FC_d: 55.94      # [推断自 __EMPTY_16]

  coal_002:
    name: "JM3_野马寨"
    indicators:
      Ad: 12.24
      Vdaf: 29.11
      St_d: 1.23
      G: 88
      Y: 23.5
      FC_d: 64.49      # [推断自 __EMPTY_16]

