# ============================================================
# 验证步骤说明
# ============================================================
verification_guide:
  step1:
    description: "构建系数矩阵 C_{6×m}"
    note: "C 的每一列对应一种煤的 6 个系数 (c₁..c₆)，值等于该煤的 Ad/Vdaf/St_d/G/Y/FC_d"
    check: "矩阵维度应为 6×m，m 为煤种数"

  step2:
    description: "计算加权平均值"
    note: "对 C 的每一行与配比向量 w 做内积再除以100"
    check: "结果应与 stage1_weighted_avg 中的 value 一致（容许 1e-6 浮点误差）"

  step3:
    description: "计算第一阶段 z 向量"
    note: "z_j = (α_j / 100) × weighted_avg_j"
    check: "结果应与 stage1_z 中的 value 一致"

  step4:
    description: "计算第二阶段 y 向量"
    note: "y_k = β₀_k + β_k × z_{k+1}，即 y₁用z₂, y₂用z₃, y₃用z₄, y₄用z₅, y₅用z₆"
    check: "结果应与 stage2_y 中的 value 一致"

